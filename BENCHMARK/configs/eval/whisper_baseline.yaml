# Whisper 백본 평가 — 샘플 벤치마크 10건
#
# 사용:
#   BENCHMARK/README.md 의 §3 TODO 6 코드 참고
#
# 새 yaml 추가 시: 본 파일 복사 → name / model_path / benchmarks 만 수정.
#   예) whisper_small_baseline.yaml   ← 백본 평가
#       whisper_finetuned_v1.yaml     ← 학습 체크포인트 평가

recognizer:
  name: whisper_small_baseline       # results/<name>/ 폴더명에 사용
  type: whisper                      # whisper | sensevoice — 어댑터 분기 키
  model_path: /data/FM/MODEL/whisper/whisper-small   # 백본 또는 학습 체크포인트 경로
  backbone: /data/FM/MODEL/whisper/whisper-small     # processor 로드용 (학습 체크포인트 평가 시에도 유지)

  options:                           # project.data.adapters.whisper.build_predict_fn 키워드 인자
    language: ko
    task: transcribe
    beam_size: 5
    batch_size: 16
    device: cuda:0

benchmarks:                          # BENCHMARK/data/<bench_id>/transcript.jsonl 자동 lookup
  - Sample10_PracticeRef

batch_size: 16                       # evaluate_on_benchmark_suite 의 배치
