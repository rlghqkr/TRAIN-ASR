# SenseVoice 백본 평가 — 샘플 벤치마크 10건
#
# 사용:
#   BENCHMARK/README.md 의 §3 TODO 6 코드 참고
#
# 새 yaml 추가 시: 본 파일 복사 → name / model_path / benchmarks 만 수정.

recognizer:
  name: sensevoice_small_baseline    # results/<name>/ 폴더명에 사용
  type: sensevoice                   # whisper | sensevoice — 어댑터 분기 키
  model_path: /data/FM/MODEL/SenseVoiceSmall   # 백본 또는 학습 체크포인트 폴더

  options:                           # project.data.adapters.sensevoice.build_predict_fn 키워드 인자
    device: cuda:0

benchmarks:                          # BENCHMARK/<bench_id>/samples.jsonl 자동 lookup
  - Sample10_PracticeRef

batch_size: 16                       # evaluate_on_benchmark_suite 의 배치
