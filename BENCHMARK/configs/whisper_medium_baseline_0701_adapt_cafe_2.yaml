# Whisper-medium 학습 체크포인트(0701 run, best=checkpoint-22000) 평가 — GOLD 전체 23개 벤치마크
# (outputs/whisper_medium_baseline_0701 은 중간 종료되어 루트 저장 파일이 없으므로,
#  best_model_checkpoint 인 checkpoint-22000 을 직접 로드한다. trainer_state.json 기준 cer=2.85 최저.)
# FM/whisper-large-v3 백본(whisper_large_v3_baseline.yaml)과 동일 23개 벤치마크·동일 GPU 로 비교하기 위한 config.
#
# 사용:
#   scripts/eval.sh BENCHMARK/configs/whisper_medium_baseline_0701.yaml --bench-root /data/ASR/BENCHMARK/GOLD

recognizer:
  name: whisper_medium_baseline_0701_adapt_cafe_2
  type: whisper
  model_path: outputs/whisper_medium_baseline_0701_adapt_cafe_2  # best 체크포인트(from_pretrained 로 그대로 로드). eval.sh 가 repo_root 에서 실행 → 상대경로 OK.

  options:
    language: ko
    task: transcribe
    beam_size: 1
    # 배치는 코드가 2단계로 받는다(아래 top-level batch_size 와 한 쌍). 둘을 같은 값으로 맞춘다.
    batch_size: 256                      # ★ 실제 GPU 배치. medium(769M). GPU2 공유 + co-tenant 학습 피크와 겹쳐 128 은 OOM → 64 로 하향.

benchmarks:
  - AIHub_FreeDialog_Senior
  - AIHub_KsponSpeech_Clean
  - AIHub_KsponSpeech_Others
  - OpenSLR_SLR40_Zeroth_ko
  - kiosk_cafe_order
  - TTS_cafe_order_10speaker

# 바깥 청크(predict_fn 한 번에 넘기는 묶음). 위 options.batch_size 와 같은 값으로 맞춘다.
# (작으면 안쪽 GPU 배치가 그만큼만 차서 손해. 배치 바꾸려면 위 options 와 여기 둘 다 같은 값으로.)
batch_size: 64
sample_frac: 1.0

runtime:
  cuda_visible_devices: "0"
  conda_env: train-asr
