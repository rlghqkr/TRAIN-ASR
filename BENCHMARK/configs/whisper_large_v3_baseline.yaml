# Whisper-large-v3 백본(FM) zero-shot 베이스라인 — GOLD 전체 23개 벤치마크
# (학습 안 한 원본 FM 백본. 학습 체크포인트 대조군은 whisper_medium_baseline_0701.yaml 와 동일 23개·동일 GPU 로 비교.)
#
# 사용:
#   scripts/eval.sh BENCHMARK/configs/whisper_large_v3_baseline.yaml --bench-root /data/ASR/BENCHMARK/GOLD

recognizer:
  name: whisper_large_v3_baseline
  type: whisper
  model_path: /data/FM/MODEL/whisper/whisper-large-v3

  options:
    language: ko
    task: transcribe
    beam_size: 1
    # 배치는 코드가 2단계로 받는다(아래 top-level batch_size 와 한 쌍). 둘을 같은 값으로 맞춘다.
    batch_size: 48                     # ★ 실제 GPU 배치. large-v3(1550M). GPU2 공유(≈44GB 여유)라 64→48 로 보수적.

benchmarks:
  - AIHub_CounselingSpeech
  - AIHub_CustomerResponse
  - AIHub_ForeignKorSpeech
  - AIHub_FreeDialog_Child
  - AIHub_FreeDialog_Senior
  - AIHub_KO_ChildSpeech
  - AIHub_KorLectureSpeech
  - AIHub_KsponSpeech_Clean
  - AIHub_KsponSpeech_Others
  - AIHub_LowQualityPhoneVoice
  - AIHub_MeetingASR
  - AIHub_NoisyCommandSpeech
  - AIHub_NoisyCommandSpeech_Denoise
  - AIHub_TelemedicineSpeech
  - AIHub_WelfareCounsel
  - NIKL_Dialect_CC
  - NIKL_Dialect_GG
  - NIKL_Dialect_GS
  - NIKL_Dialect_GW
  - NIKL_Dialect_JJ
  - NIKL_Dialect_JL
  - OpenSLR_SLR40_Zeroth_ko
  - kiosk_cafe_order

# 바깥 청크(predict_fn 한 번에 넘기는 묶음). 위 options.batch_size 와 같은 값으로 맞춘다.
# (작으면 안쪽 GPU 배치가 그만큼만 차서 손해. 배치 바꾸려면 위 options 와 여기 둘 다 같은 값으로.)
batch_size: 48
sample_frac: 1.0

runtime:
  cuda_visible_devices: "2"
  conda_env: train-asr
