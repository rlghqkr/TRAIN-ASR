# 베이스라인 학습 (Baseline) — 도메인 적응 비교 실험의 대조군.
#
# 실험 설계: "베이스라인만 학습한 모델" vs "베이스라인 + 도메인특화 학습한 모델" 의
#            벤치마크 평가 결과를 비교한다. 이 config 는 그 중 **대조군(베이스라인)**.
#
# 무엇을/왜 (vs configs/default.yaml):
#   - 학습셋 = 베이스라인 학습데이터 2개만: AIHub_KsponSpeech + OpenSLR_SLR40_Zeroth_ko.
#     · GOLD 로 합치지 않고 SILVER 의 데이터셋별 transcript.jsonl 을 **리스트로 직접 지정**.
#     · 도메인 실험은 이 리스트에 도메인특화 SILVER 2~3개를 추가하면 된다(아래 예시 주석).
#   - val 은 train 에서 자동 분할(data.val_split_ratio). 시드 고정으로 train∩val=∅.
#
# 실행 (train.sh 가 runtime.cuda_visible_devices·conda_env 를 읽어 GPU·환경 자동 셋업):
#   scripts/train.sh configs/baseline_medium_2.yaml whisper
#   → GPU 2장("0,1")이면 train.sh 가 torchrun(DDP)으로 자동 실행 (글로벌 배치 = 32×2 = 64).

experiment:
  name: whisper_medium_baseline_0701_adapt_cafe          # outputs/<name>/ + W&B run name
  seed: 42

paths:
  repo_root: .
  # 학습 JSONL — SILVER 데이터셋별 transcript.jsonl 을 리스트로(GOLD concat 불필요).
  # ★ 베이스라인 = 일반 한국어 2종만.
  train_jsonl:
      - /data/ASR/TRAIN/SILVER/TTS_cafe_order_40speaker/transcript.jsonl
  # (도메인 실험 예시 — 위 2개에 도메인특화 SILVER 를 추가):
  #   - /data/ASR/TRAIN/SILVER/AIHub_FreeDialog_Senior/transcript.jsonl
  #   - /data/ASR/TRAIN/SILVER/AIHub_LowQualityPhoneVoice/transcript.jsonl
  #
  # val 은 생략 → train 에서 자동 분할(data.val_split_ratio). 따로 관리하려면 주석 풀기:
  # val_jsonl:
  #   - /data/ASR/TRAIN/SILVER/.../transcript.jsonl
  outputs_dir: ${paths.repo_root}/outputs

models:
  whisper:
    backbone: /home/cssong/workspace/TRAIN-ASR/outputs/whisper_medium_baseline_0701/checkpoint-22000
    language: ko
    task: transcribe

data:
  text_field: text_norm              # 학습 타겟 필드. 평가(CER)와 일관되게 text_norm.
  sample_rate: 16000                 # 16kHz mono (SILVER 표준; 8kHz 는 로더가 리샘플)
  max_label_len: 256                 # 텍스트 토큰 최대 길이 (448 미만이어야함)
  num_workers: 32                     # DataLoader 워커 수(프로세스당). DDP 2GPU면 총 32×2=64개. 192코어라 여유.
  feature_mode: on_the_fly           # 피처 미리 안 굽고 학습 중 추출(디스크 0·30초낭비 0·HDD 사전계산 없음).
                                     # precompute 로 바꾸면 아래 cache_dir/num_proc 사용.
  # ── (precompute 모드일 때만 사용) ──
  # 피처 사전계산 — log-mel 을 미리 추출해 Arrow 캐시로 굽는다(학습 전 1회).
  # 풀셋은 ~0.96MB/샘플(80×3000 float32) → 수백 GB(62만 건 ≈ 600GB)라 홈(/, 여유 295G)엔
  # 못 담아 터진다. 반드시 대용량 디스크로 (이 서버는 /feat = NVMe 14TB 가 비어 있음).
  feature_cache_dir: /feat/cache/TRAIN-ASR/hf_datasets
  # 사전계산 병렬 프로세스 수. ★ 실측(2026-06-29): /data/ASR 가 단일 SATA HDD 라
  # 8·16·32·48 모두 ~10-14 ex/s 로 평평(스케일링 없음). 시크 바운드라 높이면 오히려
  # thrash. → 8 로 고정. (만약 오디오를 NVMe /feat 로 옮기면 CPU 바운드가 되어 32~64 가 유리)
  preproc_num_proc: 8
  # 적용 순서: train_sample_frac(전체 중 쓸 양) 먼저 → 그 사용분에서 val_split_ratio 로 val 분리.
  train_sample_frac: 1            # 1 = 풀셋 전량. 0<frac<1 이면 그 비율만 부분샘플.
                                     # (frac 바뀌면 precompute 캐시 새로 굽힘. on_the_fly 면 무관)
  val_split_ratio: 0.02              # (자동분할) 사용 풀에서 val 로 뗄 비율(시드 고정). val_jsonl 주면 무시.

training:
  epochs: 10                          # 풀셋이 커 2 epoch. early stopping(patience=3)이 먼저 끊을 수 있음.
  batch_size: 32
  grad_accum_steps: 1                # effective batch = batch_size × grad_accum × num_gpus (이 config: 32×1×2 = 64)
  lr: 5.0e-6
  warmup_steps: 25
  weight_decay: 0.01
  scheduler: cosine
  precision: bf16
  grad_clip: 1.0
  log_every: 5
  eval_every: 25
  save_every: 25
  early_stopping_patience: 3

wandb:
  enabled: true
  project: train-asr
  entity: null
  group: whisper
  tags: [baseline]
  notes: "baseline_medium_2.yaml 를 TTS 데이터로 카페 타스크 어댑테이션"

runtime:
  cuda_visible_devices: "0,1"          # 멀티GPU. 2장 이상이면 train.sh 가 torchrun(DDP)로 자동 실행.
  conda_env: train-asr
