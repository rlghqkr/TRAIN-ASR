# 실험 01 — 고령 화자 적응 (Senior-Speaker Adaptation)
#
# 무엇을/왜 바꾸나 (vs configs/default.yaml):
#   - 학습셋을 "KsponSpeech(일반 베이스) + age>=60 고령 풀(+@)" 로 교체.
#   - 백본 = whisper-small (주력). 레시피 확정 후 medium 으로 backbone 만 바꿔 재확인.
#   - GPU 1 사용 — GPU 0 은 GOLD 베이스라인 평가가 점유 중.
#
# 선결조건: train_jsonl 이 먼저 빌드돼 있어야 함 (고령 풀 + 일반 믹스).
#   val 은 paths.val_jsonl 을 쓰거나, data.val_split_ratio 로 train 에서 자동 분할.
#   → 실험 개요는 GUIDELINE/3_도메인적응_노인발화.md 참고.

experiment:
  name: whisper_senior_adapt_v1      # outputs/<name>/ + W&B run name
  seed: 42

paths:
  repo_root: .
  # 학습 JSONL (Sample 스키마). 절대경로로 /data/ASR/TRAIN 아래를 직접 가리킨다.
  train_jsonl: /data/ASR/TRAIN/exp/senior_adapt_v1/train.jsonl   # KsponSpeech + age>=60 고령 풀(+@)
  # val 은 생략 → train 에서 자동 분할(data.val_split_ratio). 따로 관리하려면 아래 주석 풀기:
  # val_jsonl: /data/ASR/TRAIN/exp/senior_adapt_v1/val.jsonl
  outputs_dir: ${paths.repo_root}/outputs

models:
  whisper:
    backbone: /data/FM/MODEL/whisper/whisper-small   # 주력. medium 재확인 시 이 줄만 교체.
    language: ko
    task: transcribe

data:
  text_field: text_norm              # 학습 타겟 필드. 평가(CER)와 일관되게 text_norm 권장.
  sample_rate: 16000                 # 16kHz mono (SILVER 표준)
  max_label_len: 200                 # 텍스트 토큰 최대 길이
  num_workers: 8                     # DataLoader 워커 수
  # 적용 순서: train_sample_frac(전체 중 쓸 양) 먼저 → 그 사용분에서 val_split_ratio 로 val 분리.
  train_sample_frac: 1.0             # 전체 고령 풀 중 실제 사용할 비율(시드 고정, 먼저 적용). <1.0=빠른 탐색. 1.0=전량.
  val_split_ratio: 0.02              # (자동분할) 위 사용 풀에서 val 로 뗄 비율(시드 고정). val_jsonl 주면 무시. 기본 2%.

training:
  epochs: 3                          # 풀이 크므로 3 epoch 면 충분. early stopping 이 먼저 끊을 수 있음.
  batch_size: 16                     # whisper-small + 96GB 여유. medium 이면 8 로.
  grad_accum_steps: 2                # effective batch = 16 × 2 = 32
  lr: 1.0e-5                         # 파인튜닝 적정. medium 이면 5.0e-6 권장(망각↓).
  warmup_steps: 500
  weight_decay: 0.01
  scheduler: cosine
  precision: bf16                    # A100/H100 → bf16 안전
  grad_clip: 1.0
  log_every: 25
  eval_every: 1000                   # val(고령+일반)로 망각 모니터링
  save_every: 1000
  early_stopping_patience: 3

wandb:
  enabled: true
  project: train-asr
  entity: null
  group: whisper
  tags: [senior_adapt, rehearsal_2to1]
  notes: "고령 화자 적응 v1 — age>=60 풀 + 일반 2:1 믹스, whisper-small"

runtime:
  cuda_visible_devices: "1"          # GPU 0 은 베이스라인 평가 점유 중 → 학습은 1번
  conda_env: train-asr
