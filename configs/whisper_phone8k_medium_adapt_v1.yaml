# 실험 02 (Medium) — 저음질 전화망 적응 (Narrowband Telephony Adaptation, whisper-medium)
#
# 무엇을/왜 바꾸나 (vs configs/whisper_phone8k_adapt_v1.yaml = small 도메인):
#   - 백본만 whisper-medium 으로 교체 (769M). 학습셋은 동일(베이스라인 2 + 전화채널 도메인 3).
#   - medium 권고: batch_size 8 + grad_accum 4 (effective 32 유지), lr 5e-6 (망각 ↓).
#   - GPU 1 사용 (기호 = GPU1).
#
# 짝(대조군): configs/whisper_medium_baseline.yaml — 같은 medium 백본, 도메인 데이터 없이.
#   두 모델을 같은 GOLD 벤치마크 전체에 평가해 전화망 CER ↓ / 나머지 유지 를 확인한다.
#
# 선결조건: 아래 SILVER 데이터셋들이 빌드돼 있어야 함 (/data/ASR/TRAIN/SILVER/*/transcript.jsonl).
#   → 실험 개요는 GUIDELINE/3_도메인적응_저음질전화망.md 참고.

experiment:
  name: whisper_phone8k_medium_adapt_v1
  seed: 42

paths:
  repo_root: .
  # 학습 JSONL — SILVER 데이터셋별 transcript.jsonl 리스트 (베이스라인 + 전화채널 도메인).
  train_jsonl:
    - /data/ASR/TRAIN/SILVER/AIHub_KsponSpeech/transcript.jsonl        # 베이스라인(일반 광대역)
    - /data/ASR/TRAIN/SILVER/OpenSLR_SLR40_Zeroth_ko/transcript.jsonl  # 베이스라인(가드)
    - /data/ASR/TRAIN/SILVER/AIHub_LowQualityPhoneVoice/transcript.jsonl  # ★ 전화 주력(8k+wide)
    - /data/ASR/TRAIN/SILVER/AIHub_CounselingSpeech/transcript.jsonl   # ○ 전화(상담)
    - /data/ASR/TRAIN/SILVER/AIHub_WelfareCounsel/transcript.jsonl     # ○ 전화(복지상담)
  # val 은 생략 → train 에서 자동 분할(data.val_split_ratio).
  outputs_dir: ${paths.repo_root}/outputs

models:
  whisper:
    backbone: /data/FM/MODEL/whisper/whisper-medium   # ★ medium (769M)
    language: ko
    task: transcribe

data:
  text_field: text_norm              # 학습 타겟 필드. 평가(CER)와 일관되게 text_norm 권장.
  sample_rate: 16000                 # 모델 입력은 16k. 전화 음원도 SILVER 에서 16k 로 업샘플된 상태.
  max_label_len: 200                 # 텍스트 토큰 최대 길이
  num_workers: 8                     # DataLoader 워커 수
  # 적용 순서: train_sample_frac(전체 중 쓸 양) 먼저 → 그 사용분에서 val_split_ratio 로 val 분리.
  train_sample_frac: 1.0             # 1.0=전량. 스모크 테스트 때는 0.1 로 낮춰 빠르게 검증 후 되돌린다.
  val_split_ratio: 0.02              # (자동분할) 위 사용 풀에서 val 로 뗄 비율(시드 고정). val_jsonl 주면 무시.

training:
  epochs: 3
  batch_size: 8                      # ★ medium → 8 (small 16 대비 절반)
  grad_accum_steps: 4                # effective batch = 8 × 4 = 32
  lr: 5.0e-6                         # ★ medium 권고 (망각 ↓). small 은 1e-5.
  warmup_steps: 500
  weight_decay: 0.01
  scheduler: cosine
  precision: bf16
  grad_clip: 1.0
  log_every: 25
  eval_every: 1000
  save_every: 1000
  early_stopping_patience: 3

wandb:
  enabled: true
  project: train-asr
  entity: null
  group: whisper
  tags: [phone8k_adapt, medium, rehearsal_2to1, narrowband_aug]
  notes: "저음질 전화망 적응 v1 — 전화채널 풀 + 광대역 2:1 믹스, whisper-medium"

runtime:
  cuda_visible_devices: "1"          # 기호 = GPU1
  conda_env: TRAIN-ASR
