# 스모크 테스트 — 학습 파이프라인이 끝까지 도는지만 빠르게 확인.
#
# 변경점 (vs default.yaml):
# - 데이터 = SILVER 작은 1개(Zeroth) + train_sample_frac 로 소량만. val 은 train 에서 자동 분할.
# - epochs 1, batch 2, eval/save/log step 매우 짧게
# - early_stopping 끔, wandb 끔 (로그인 불필요)
#
# 실행:
#   CUDA_VISIBLE_DEVICES=2 conda run -n train-asr \
#       python scripts/train.py --config configs/smoke.yaml --model whisper

experiment:
  name: smoke_test
  seed: 42

paths:
  repo_root:   .                                  # 저장소 루트 기준 상대경로 (런처가 루트로 cd 후 실행)
  train_jsonl:                                     # SILVER 작은 1개 (아래 train_sample_frac 로 더 줄임)
    - /data/ASR/TRAIN/SILVER/OpenSLR_SLR40_Zeroth_ko/transcript.jsonl
  # val 은 생략 → train 에서 자동 분할(data.val_split_ratio).
  outputs_dir: ${paths.repo_root}/outputs

models:
  whisper:
    backbone: /data/FM/MODEL/whisper/whisper-small
    language: ko
    task: transcribe

data:
  text_field:    text_norm           # 학습 타겟 필드 (평가와 일관되게 text_norm)
  sample_rate:   16000               # 16kHz mono
  max_label_len: 200                 # 텍스트 토큰 최대 길이
  num_workers:   2                   # 스모크라 워커 적게
  # 적용 순서: train_sample_frac(전체 중 쓸 양) 먼저 → 그 사용분에서 val_split_ratio 로 val 분리.
  train_sample_frac: 0.02            # Zeroth 22K 중 ~2%(~440건)만 — 스모크는 빠른 통과만 확인
  val_split_ratio: 0.2               # 소량(~24건)이라 20% 를 val 로 (자동 분할). val_jsonl 주면 무시.

training:
  epochs: 1
  batch_size: 2
  grad_accum_steps: 1
  lr: 1.0e-5
  warmup_steps: 0
  weight_decay: 0.0
  scheduler: constant
  precision: bf16
  grad_clip: 1.0
  log_every: 1
  eval_every: 5
  save_every: 5
  # early_stopping_patience 생략 → load_best_model 비활성 (스모크엔 불필요)

wandb:
  enabled: false

runtime:
  cuda_visible_devices: "2"
  conda_env: train-asr
