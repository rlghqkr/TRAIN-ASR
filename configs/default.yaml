# 실험 식별
experiment:
  name: default                  # 출력 폴더 이름. outputs/<name>/ 에 학습 산출물 저장.
  seed: 42                       # 재현성. seed_everything(seed) 로 모든 무작위성 고정.

# 학습 입출력 경로만 관리. 평가셋 경로는 BENCHMARK/configs/eval/*.yaml 이 소유한다.
paths:
  repo_root:           /home/cssong/workspace/TRAIN-ASR

  # 학습/검증 JSONL (Sample 스키마 — project/data/schema.py).
  # silver/gold 어디든 직접 지정 가능. 예: ${paths.repo_root}/data/SILVER/....
  train_jsonl:         ${paths.repo_root}/data/SILVER/train.jsonl      # 학습용
  val_jsonl:           ${paths.repo_root}/data/SILVER/val.jsonl        # 학습 중 모니터링용 (작은 분량)

  # 학습 산출물
  outputs_dir:         ${paths.repo_root}/outputs                      # model / config.yaml / train.log

# 모델 백본 — 로컬 경로 또는 HuggingFace ID
models:
  sensevoice:
    backbone: /home/cssong/workspace/data/FM/MODEL/SenseVoiceSmall
    trust_remote_code: true      # FunASR 가 백본 폴더 안의 .py 코드를 신뢰하고 실행
  whisper:
    backbone: /data/FM/MODEL/whisper/whisper-small   # 로컬 경로. tiny/base/small/medium/large-v3 중 선택 (/data/FM/MODEL/whisper/).

    language: ko                 # 강제 디코더 언어 토큰 (`<|ko|>`)
    task: transcribe             # transcribe (그대로) | translate (영어로 번역)

# 학습/평가 공통 데이터 옵션
data:
  text_field:     text_norm         # text | text_norm — 평가와 일관되게 text_norm 권장
  sample_rate:    16000             # 16kHz mono. SILVER 단계에서 통일된 표준.
  max_label_len:  200               # 텍스트 토큰 최대 길이
  num_workers:    4                 # DataLoader 워커 수. CPU 코어 수 / 메모리 봐서 조정.

# 학습 하이퍼파라미터
training:
  epochs: 5
  batch_size: 8                     # GPU 메모리에 맞춰 조정. SenseVoice 는 토큰 단위 동적 배칭 (사이즈 의미 다름).
  grad_accum_steps: 4               # effective batch = batch_size × grad_accum_steps × num_gpus
  lr: 1.0e-5                        # 파인튜닝 적정 범위 1e-6 ~ 5e-5. 큰 LR 은 사전학습 능력 손상 (catastrophic forgetting).
  warmup_steps: 500                 # 초반 LR 0 → 목표 LR 까지 선형 증가. 초기 학습 안정화.
  weight_decay: 0.01                # AdamW 정규화 강도
  scheduler: cosine                 # cosine | linear | constant
  precision: bf16                   # fp32 | fp16 | bf16. A100/H100 → bf16 안전, V100/RTX → fp16.
  grad_clip: 1.0                    # gradient norm 클리핑. NaN 발산 방지.
  log_every: 25                     # 매 N step 마다 loss / lr / grad_norm 로그
  eval_every: 1000                  # 매 N step 마다 val 평가
  save_every: 1000                  # 매 N step 마다 체크포인트 저장
  early_stopping_patience: 3        # val 개선 없는 평가 N 회 연속이면 학습 중단

# 평가는 이 파일이 아니라 BENCHMARK/configs/eval/*.yaml 에서 관리한다 (학습/평가 분리).

# Weights & Biases — 실험 추적
wandb:
  enabled: true                     # false 면 wandb 호출 모두 no-op
  project: train-asr                # W&B 프로젝트 이름
  entity: null                      # null = 본인 기본 entity. 팀 entity 가 있으면 명시.
  group: null                       # sensevoice | whisper — 모델별 그룹으로 W&B UI 에서 분류
  tags: []                          # 자유 태그 (예: [baseline, lr_sweep])
  notes: ""                         # 이번 실험에서 무엇을, 왜 바꿨는지 한 문장

# 런타임 환경
runtime:
  cuda_visible_devices: "2"         # 쉼표 구분 GPU 인덱스 (예: "0" / "0,1" / "0,1,2,3")
  conda_env: train-asr              # 활성화된 conda 환경 이름 (whisper·sensevoice 공용)
