# 베이스라인 학습 (Medium) — 도메인 적응 비교 실험의 대조군 (whisper-medium).
#
# 실험 설계: "베이스라인만 학습한 모델" vs "베이스라인 + 도메인특화 학습한 모델" 의
#            벤치마크 평가 결과를 비교한다. 이 config 는 그 중 **대조군(베이스라인) · medium**.
#
# 무엇을/왜 (vs configs/baseline.yaml = small 베이스라인):
#   - 백본만 whisper-medium 으로 교체 (769M). 학습셋은 동일(Kspon+Zeroth).
#   - medium 권고: batch_size 8 + grad_accum 4 (effective 32 유지), lr 5e-6 (망각 ↓).
#   - GPU 1 사용 (기호 = GPU1).
#
# 실행:
#   scripts/train.sh configs/whisper_medium_baseline.yaml whisper

experiment:
  name: whisper_medium_baseline      # outputs/<name>/ + W&B run name
  seed: 42

paths:
  repo_root: .
  # 학습 JSONL — SILVER 데이터셋별 transcript.jsonl 리스트. ★ 베이스라인 = 일반 한국어 2종만.
  train_jsonl:
    - /data/ASR/TRAIN/SILVER/AIHub_KsponSpeech/transcript.jsonl
    - /data/ASR/TRAIN/SILVER/OpenSLR_SLR40_Zeroth_ko/transcript.jsonl
  # val 은 생략 → train 에서 자동 분할(data.val_split_ratio).
  outputs_dir: ${paths.repo_root}/outputs

models:
  whisper:
    backbone: /data/FM/MODEL/whisper/whisper-medium   # ★ medium (769M)
    language: ko
    task: transcribe

data:
  text_field: text_norm              # 학습 타겟 필드. 평가(CER)와 일관되게 text_norm.
  sample_rate: 16000                 # 16kHz mono (SILVER 표준)
  max_label_len: 200                 # 텍스트 토큰 최대 길이
  num_workers: 8                     # DataLoader 워커 수
  # 적용 순서: train_sample_frac(전체 중 쓸 양) 먼저 → 그 사용분에서 val_split_ratio 로 val 분리.
  train_sample_frac: 1.0             # 1.0=전량. 스모크 테스트 때는 0.1 로 낮춰 빠르게 검증 후 되돌린다.
  val_split_ratio: 0.02              # (자동분할) 사용 풀에서 val 로 뗄 비율(시드 고정). val_jsonl 주면 무시.

training:
  epochs: 3                          # 풀이 크므로 3 epoch. early stopping 이 먼저 끊을 수 있음.
  batch_size: 8                      # ★ medium → 8 (small 16 대비 절반). 96GB 기준.
  grad_accum_steps: 4                # effective batch = 8 × 4 = 32 (small 베이스라인과 동일)
  lr: 5.0e-6                         # ★ medium 권고 (망각 ↓). small 은 1e-5.
  warmup_steps: 500
  weight_decay: 0.01
  scheduler: cosine
  precision: bf16                    # A100/H100 → bf16 안전
  grad_clip: 1.0
  log_every: 25
  eval_every: 1000
  save_every: 1000
  early_stopping_patience: 3

wandb:
  enabled: true
  project: train-asr
  entity: null
  group: whisper
  tags: [baseline, medium]
  notes: "베이스라인(Kspon+Zeroth)만 학습 — 도메인 적응 비교 대조군, whisper-medium"

runtime:
  cuda_visible_devices: "1"          # 기호 = GPU1
  conda_env: TRAIN-ASR
