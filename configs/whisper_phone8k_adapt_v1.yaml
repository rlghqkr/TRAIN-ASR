# 실험 02 — 저음질 전화망 적응 (Narrowband Telephony Adaptation)
#
# 무엇을/왜 바꾸나 (vs configs/baseline.yaml):
#   - 학습셋 = 베이스라인(Kspon+Zeroth) + 전화채널 도메인(LowQualityPhone ★ + Counseling + Welfare).
#     SILVER 데이터셋별 transcript.jsonl 을 리스트로 직접 지정(GOLD/사전 믹스 불필요).
#   - 백본 = whisper-small (주력). 확정 후 medium backbone 재확인.
#   - GPU 1 사용 — GPU 0 은 베이스라인 평가가 점유 중.
#
# 선결조건: 아래 SILVER 데이터셋들이 빌드돼 있어야 함 (/data/ASR/TRAIN/SILVER/*/transcript.jsonl).
#   val 은 paths.val_jsonl 을 쓰거나, data.val_split_ratio 로 train 에서 자동 분할.
#   주의: 리스트는 데이터셋 **자연 크기 그대로 concat**(2:1 리허설 믹스·전화채널 필터 아님). 비율 조정은 별도.
#   → 실험 개요는 GUIDELINE/3_도메인적응_저음질전화망.md 참고.

experiment:
  name: whisper_phone8k_adapt_v1
  seed: 42

paths:
  repo_root: .
  # 학습 JSONL — SILVER 데이터셋별 transcript.jsonl 리스트 (베이스라인 + 전화채널 도메인).
  train_jsonl:
    - /data/ASR/TRAIN/SILVER/AIHub_KsponSpeech/transcript.jsonl        # 베이스라인(일반 광대역)
    - /data/ASR/TRAIN/SILVER/OpenSLR_SLR40_Zeroth_ko/transcript.jsonl  # 베이스라인(가드)
    - /data/ASR/TRAIN/SILVER/AIHub_LowQualityPhoneVoice/transcript.jsonl  # ★ 전화 주력(8k+wide)
    - /data/ASR/TRAIN/SILVER/AIHub_CounselingSpeech/transcript.jsonl   # ○ 전화(상담)
    - /data/ASR/TRAIN/SILVER/AIHub_WelfareCounsel/transcript.jsonl     # ○ 전화(복지상담)
  # val 은 생략 → train 에서 자동 분할(data.val_split_ratio). 따로 관리하려면 아래 주석 풀기:
  # val_jsonl:
  #   - /data/ASR/TRAIN/SILVER/.../transcript.jsonl
  outputs_dir: ${paths.repo_root}/outputs

models:
  whisper:
    backbone: /data/FM/MODEL/whisper/whisper-small
    language: ko
    task: transcribe

data:
  text_field: text_norm              # 학습 타겟 필드. 평가(CER)와 일관되게 text_norm 권장.
  sample_rate: 16000                 # 모델 입력은 16k. 전화 음원도 SILVER 에서 16k 로 업샘플된 상태.
  max_label_len: 200                 # 텍스트 토큰 최대 길이
  num_workers: 8                     # DataLoader 워커 수
  # 적용 순서: train_sample_frac(전체 중 쓸 양) 먼저 → 그 사용분에서 val_split_ratio 로 val 분리.
  train_sample_frac: 1.0             # 전체 전화채널 풀 중 실제 사용할 비율(시드 고정, 먼저 적용). <1.0=빠른 탐색. 1.0=전량.
  val_split_ratio: 0.02              # (자동분할) 위 사용 풀에서 val 로 뗄 비율(시드 고정). val_jsonl 주면 무시. 기본 2%.

training:
  epochs: 3
  batch_size: 16
  grad_accum_steps: 2                # effective batch = 32
  lr: 1.0e-5
  warmup_steps: 500
  weight_decay: 0.01
  scheduler: cosine
  precision: bf16
  grad_clip: 1.0
  log_every: 25
  eval_every: 1000
  save_every: 1000
  early_stopping_patience: 3

wandb:
  enabled: true
  project: train-asr
  entity: null
  group: whisper
  tags: [phone8k_adapt, rehearsal_2to1, narrowband_aug]
  notes: "저음질 전화망 적응 v1 — 전화채널 풀 + 광대역 2:1 믹스, whisper-small"

runtime:
  cuda_visible_devices: "1"
  conda_env: train-asr
